services:
  api:
    build:
      context: .
      dockerfile: ./docker/local/django/Dockerfile
    command: /start
    volumes:
      - .:/app:z
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
    ports:
      - "8000:8000"
    env_file:
      - ./.envs/.local/.django
      - ./.envs/.local/.postgres
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - authors-api

  postgres:
    build:
      context: .
      dockerfile: ./docker/local/postgres/Dockerfile
    volumes:
      - local_postgres_data:/var/lib/postgresql/data
      - local_postgres_data_backups:/backups
    env_file:
      - ./.envs/.local/.postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - authors-api

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    ports:
      - "8025:8025"
    networks:
      - authors-api


  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - authors-api


  celery_worker:
    build:
      context: .
      dockerfile: ./docker/local/django/Dockerfile

    command: /start-celeryworker

    volumes:
      - .:/app

    env_file:
      - ./.envs/.local/.django
      - ./.envs/.local/.postgres

    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started

    networks:
      - authors-api


  flower:
    build:
      context: .
      dockerfile: ./docker/local/django/Dockerfile

    command: /start-flower

    volumes:
      - flower_data:/data

    env_file:
      - ./.envs/.local/.django
      - ./.envs/.local/.postgres

    ports:
      - "5555:5555"

    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

    networks:
      - authors-api


  nginx:
    restart: always

    depends_on:
      - api

    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles

    build:
      context: ./docker/local/nginx
      dockerfile: Dockerfile
    ports:
      - "8080:80"

    networks:
      - authors-api

networks:
  authors-api:
    driver: bridge

volumes:
  static_volume:
  media_volume:
  local_postgres_data:
  local_postgres_data_backups:
  flower_data: